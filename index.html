@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');
* { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
::-webkit-scrollbar { display: none; }
input { font-size: 16px; }
.bw-fade { animation: bwFade .3s ease; }
@keyframes bwFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.bw-sheet { animation: bwUp .26s cubic-bezier(.2,.8,.2,1); }
@keyframes bwUp { from { transform: translateY(100%); } to { transform: none; } }
.bw-pulse { animation: bwPulse 1.2s ease-in-out infinite; }
@keyframes bwPulse { 0%,100% { opacity: .4; transform: scale(.95);} 50% { opacity: 1; transform: scale(1.05);} }
button:active { transform: scale(0.97); }
button:focus, button:focus-visible { outline: none; }

/* Hover row actions. Gated on the input device, not viewport width, so a touch laptop
   keeps swipe-to-delete and never gets a control it cannot reveal. The button is only
   rendered when this same query matches (see PackView), so there is no orphan state. */
@media (hover: hover) and (pointer: fine) {
  .bw-row-del { opacity: 0; transition: opacity .12s ease; border-radius: 8px; }
  .bw-row:hover .bw-row-del { opacity: 0.75; }
  .bw-row .bw-row-del:hover { opacity: 1; background: rgba(176,84,58,0.12); }
  .bw-row-del:focus-visible { opacity: 1; background: rgba(176,84,58,0.12); }
}

/* ---------- Responsive shell ----------
   .bw-shell carries the width clamp that used to be inline on S.shell. The base
   values below are byte-for-byte what mobile computed before, so anything under
   ${vr}px renders identically. */
.bw-shell { max-width: 480px; margin: 0 auto; }

/* Phone: the guide button absorbs the spare space so it sits at the bottom of the
   screen, with the credit line tucked directly beneath it. */
.bw-home-guide { margin-top: auto; }
.bw-home-foot { margin-top: 0; }

/* The home screen is a menu, not data — it gains nothing from the shell's full
   desktop width, and stretching its rows to 1240px looks broken. Clamp it back to
   a comfortable column, centred in the wide shell. */
@media (min-width: ${vr}px) {
  /* One comfortable reading column. Wide enough for gear rows to breathe, narrow
     enough that they do not stretch into an unreadable line — 480px felt stranded on a
     big monitor, 1240px was the opposite problem. */
  .bw-shell { max-width: 820px; }
  .bw-home { max-width: 560px; width: 100%; margin-left: auto; margin-right: auto; }
  /* Desktop: hand the spare space back to the footer so the block stays vertically
     centred (see the :first-child rule below) — two auto margins would split it and
     pull the layout apart instead. */
  .bw-home-guide { margin-top: 14px; }
