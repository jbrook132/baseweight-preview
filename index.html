@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap');
* { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
::-webkit-scrollbar { display: none; }
input { font-size: 16px; }
.bw-fade { animation: bwFade .3s ease; }
@keyframes bwFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.bw-sheet { animation: bwUp .26s cubic-bezier(.2,.8,.2,1); }
@keyframes bwUp { from { transform: translateY(100%); } to { transform: none; } }
.bw-pulse { animation: bwPulse 1.2s ease-in-out infinite; }
@keyframes bwPulse { 0%,100% { opacity: .4; transform: scale(.95);} 50% { opacity: 1; transform: scale(1.05);} }
button:active { transform: scale(0.97); }
button:focus, button:focus-visible { outline: none; }

/* Hover row actions. Gated on the input device, not viewport width, so a touch laptop
   keeps swipe-to-delete and never gets a control it cannot reveal. The button is only
   rendered when this same query matches (see PackView), so there is no orphan state. */
@media (hover: hover) and (pointer: fine) {
  .bw-row-del { opacity: 0; transition: opacity .12s ease; border-radius: 8px; }
  .bw-row:hover .bw-row-del { opacity: 0.75; }
  .bw-row .bw-row-del:hover { opacity: 1; background: rgba(176,84,58,0.12); }
  .bw-row-del:focus-visible { opacity: 1; background: rgba(176,84,58,0.12); }
}

/* ---------- Responsive shell ----------
   .bw-shell carries the width clamp that used to be inline on S.shell. The base
   values below are byte-for-byte what mobile computed before, so anything under
   ${ha}px renders identically. */
.bw-shell { max-width: 480px; margin: 0 auto; }

/* Phone: the guide button absorbs the spare space so it sits at the bottom of the
   screen, with the credit line tucked directly beneath it. */
.bw-home-guide { margin-top: auto; }
.bw-home-foot { margin-top: 0; }

/* Two-column body. Only ever mounted at >= ${ha}px (see useMediaQuery in App),
   so these rules need no media query of their own.
   min-height: 0 is load-bearing on BOTH the row and the columns — without it flex
   children refuse to shrink below their content height, the columns never scroll,
   and the position:fixed shell overflows. */
.bw-cols { display: flex; flex: 1; min-height: 0; gap: 8px; }
.bw-col { min-height: 0; -webkit-overflow-scrolling: touch;
          padding: 12px 16px calc(${ws} + 12px); }
/* Only the gear list scrolls as a column. The breakdown column does not: the panel
   inside it manages its own scrolling so the donut can stay put. Set per-column rather
   than overriding a shared .bw-col rule — both are single class selectors, so an
   override would depend on source order. */
.bw-col-main { flex: 1.35 1 0; overflow-y: auto; }
.bw-col-chart { flex: 1 1 0; overflow: hidden; }

@media (min-width: ${ha}px) { .bw-shell { max-width: 1100px; } }
@media (min-width: 1440px) { .bw-shell { max-width: 1240px; } }

/* The home screen is a menu, not data — it gains nothing from the shell's full
   desktop width, and stretching its rows to 1240px looks broken. Clamp it back to
   a comfortable column, centred in the wide shell. */
@media (min-width: ${ha}px) {
  /* Breakdown panel: a head that stays put above a body that scrolls.
     min-height:0 is load-bearing on both, exactly as on .bw-cols — without it the flex
     children refuse to shrink and the inner scroll never engages.
     Background is the page paper colour, not the card colour: the legend and
     heaviest-items blocks already carry their own card backgrounds inline, and
     card-inside-card reads muddy — and those inline backgrounds could not be
     neutralised from CSS anyway. */
  .bw-panel { display: flex; flex-direction: column; height: 100%; min-height: 0;
              background: ${p.paper}; border: 1px solid ${p.line}; border-radius: 16px; }
  .bw-panel-head { flex: 0 0 auto; padding: 8px 14px 7px; text-align: center;
                   border-bottom: 1px solid ${p.lineSoft}; }
  /* Fade the bottom edge so content runs out gracefully instead of clipping against
     nothing (scrollbars are hidden globally, so there is no other cue that more
     follows). Bottom only — content leaving the top meets the solid head. */
  .bw-panel-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 10px 12px 0;
                     -webkit-overflow-scrolling: touch;
                     -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent 100%);
                     mask-image: linear-gradient(to bottom, #000 calc(100% - 28px), transparent 100%); }

  .bw-home { max-width: 720px; width: 100%; margin-left: auto; margin-right: auto; }
  /* Desktop: hand the spare space back to the footer so the block stays vertically
     centred (see the :first-child rule below) — two auto margins would split it and
     pull the layout apart instead. */
  .bw-home-guide { margin-top: 14px; }
  .bw-home-foot { margin-top: auto; }
  /* Two tabs do not need the full shell width; left-aligned so the control reads as
     belonging to the list column it actually switches. S.seg keeps its 0 16px margin. */
  .bw-seg { max-width: 320px; }
  /* Row spacing comes from each card's own inline marginBottom (14), so only the
     column gap is set here — that keeps the grid even without fighting inline styles. */
  /* Visible but quiet at rest so the actions are discoverable without shouting,
     full strength on hover. */
  .bw-card-actions { opacity: .45; transition: opacity .12s ease; }
  .bw-list-card:hover .bw-card-actions { opacity: 1; }
  .bw-home-lists { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); column-gap: 14px; }
}
/* Centre it vertically too, but only when the window is definitely tall enough to
   hold it. An auto top margin inside a scroll container can push content above the
   scrollable area, so this must never apply in a short window. */
@media (min-width: ${ha}px) and (min-height: 900px) {
  .bw-home > :first-child { margin-top: auto; }
}

        navigator.serviceWorker.register('sw.js')
